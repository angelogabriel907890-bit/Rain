<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chuva Realista WebAR</title>
    <!-- Motores 3D e AR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Sistema de Partículas para a Chuva -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@a_master/dist/aframe-particle-system-component.min.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Efeito de Chuva -->
      <a-entity 
        position="0 2.5 -2" 
        particle-system="
          preset: rain;
          particleCount: 6000;
          color: #FFFFFF;
          size: 0.12;
          velocityValue: 0 -8 0;
          accelerationValue: 0 -3 0;
          opacity: 0.7;
          maxAge: 2;
          blending: 1;
        ">
      </a-entity>

      <!-- Câmera do Usuário -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
